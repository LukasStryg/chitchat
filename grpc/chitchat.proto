syntax = "proto3";
package chitchat;
option go_package = "chitchat/grpc";

service ChitChat {
    rpc Join (JoinRequest) returns (stream ChatMessage);
    rpc Publish (PublishRequest) returns (Ack);
    rpc Leave (LeaveRequest) returns (Ack);
}

message JoinRequest {
    string name = 1;
    int64 lamport = 2;
}

message PublishRequest {
    string name = 1;
    string text = 2;
    int64 lamport = 3;
}

message LeaveRequest {
    string name = 1;
    int64 lamport = 2;
}

message ChatMessage {
    string sender = 1;
    string text = 2;
    int64 lamport = 3;
}

message Ack {}
